name: Build Fateh Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP and find project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          find . -maxdepth 3 -type f -name '*.zip' \
            ! -path './extracted/*' -print0 |
          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done

          echo "Searching for Gradle project..."

          SETTINGS=$(find . -maxdepth 8 -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) ! -path './.git/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found."
            echo "Available files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found project: $SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
